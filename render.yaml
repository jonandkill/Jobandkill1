services:
  - type: web
    name: jobnkill-susi-planner
    runtime: node
    plan: free
    region: singapore
    branch: susi-planner
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobnkill-susi-db
          property: connectionString

databases:
  - name: jobnkill-susi-db
    databaseName: jobnkill_susi
    user: jobnkill_susi
    plan: free
    region: singapore
    ipAllowList: []
