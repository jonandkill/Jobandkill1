<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진학설계 반응형 내부 검수</title><style>body{margin:0;padding:16px;font:16px system-ui;background:#eee;color:#222}label,button,select{font:inherit;min-height:44px}iframe{display:block;height:820px;border:1px solid #777;margin-top:16px;background:white}p{max-width:700px}</style><h1>반응형 내부 검수</h1><p>실제 페이지를 선택한 화면 너비 안에서 표시합니다. 실제 휴대전화·수험생 사용성 검수를 대체하지 않습니다.</p><label>화면 너비 <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option></select></label><label>화면 <select id="route"><option value="home">홈</option><option value="recommend">성적 추천</option><option value="prepare/essay">논술 풀기</option><option value="prepare/writing">자기소개서 작성</option><option value="prepare/interview">면접 준비</option><option value="find">대학 찾기</option><option value="profile">내 현황</option><option value="majors">학과 검색</option><option value="history">입결 비교</option><option value="prepare/exams">논술 자료</option></select></label><iframe title="진학설계 검수 화면" id="frame" width="390" src="/#home"></iframe><script>const frame=document.getElementById('frame');document.getElementById('width').onchange=e=>frame.width=e.target.value;document.getElementById('route').onchange=e=>frame.src='/#'+e.target.value;</script></html>
