<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>브랜드 레시피 반응형 QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#dfe6eb;font-family:system-ui,sans-serif}.device{width:390px;max-width:100vw}.label{padding:9px 12px;background:#0b1d32;color:#fff;font-size:12px;font-weight:800}.device iframe{display:block;width:390px;max-width:100vw;height:844px;border:0;background:#fff;box-shadow:0 18px 55px rgba(11,29,50,.22)}
  </style>
</head>
<body>
  <main class="device">
    <div class="label">QA · 390 × 844 CSS px</div>
    <iframe id="qaFrame" src="./" title="모바일 반응형 검수 화면"></iframe>
  </main>
  <script>
    const page=new URLSearchParams(location.search).get('page');
    if(page&&/^[a-z0-9-]+\.html$/i.test(page))document.querySelector('#qaFrame').src=`./${page}`;
  </script>
</body>
</html>
